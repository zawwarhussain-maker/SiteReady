<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SiteReady GCC — Dual Mobile & Web Enterprise Compliance Prototype</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  
  <!-- Fonts: Inter (English), IBM Plex Sans Arabic (Arabic), Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#16324F",
            "primary-navy": "#16324F",
            "primary-navy-dark": "#0F2236",
            "primary-navy-surface": "#EFF4FF",
            secondary: "#168C82",
            "safety-teal": "#168C82",
            "safety-teal-light": "#E6F5F3",
            "warning-amber": "#F2B544",
            "warning-amber-light": "#FEF8EC",
            "critical-red": "#C83E4D",
            "critical-red-light": "#FDECEE",
            surface: "#F8F9FF",
            "surface-dim": "#cbdbf5",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d3e4fe",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#43474d",
            "outline-variant": "#c3c6ce"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            arabic: ["IBM Plex Sans Arabic", "sans-serif"]
          }
        }
      }
    };
  </script>

  <!-- Prototype Custom Styles & Device Simulator -->
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="bg-[#0b1523] text-[#172B3A] antialiased">

  <!-- Top Global Presentation & Viewport Switcher Bar -->
  <nav id="presentation-bar"></nav>

  <!-- Master Interactive Canvas -->
  <main id="prototype-canvas" class="prototype-canvas"></main>

  <!-- Interactive Modal Container -->
  <div id="modal-container"></div>

  <!-- Global Toast Notification Component -->
  <aside id="global-toast" class="fixed bottom-6 right-6 max-w-md bg-[#16324F] text-white p-3.5 rounded-2xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-none z-50 border border-white/20">
    <span class="material-symbols-outlined text-[#168C82] text-[22px] toast-icon">check_circle</span>
    <span class="text-[13px] font-semibold flex-1 toast-message">Action processed successfully</span>
    <button onclick="document.getElementById('global-toast').classList.add('opacity-0', 'pointer-events-none', 'translate-y-4')" class="text-white/60 hover:text-white text-[12px] font-mono px-1">✕</button>
  </aside>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/web-views.js"></script>
  <script src="js/mobile-views.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
