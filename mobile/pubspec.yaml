name: siteready_gcc
description: "SiteReady GCC — Bilingual Contractor Compliance and Safety SaaS Platform Android Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Supabase
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.2

  # Localization & Date formatting
  intl: ^0.20.3

  # Typography (Inter & Noto Sans Arabic)
  google_fonts: ^6.2.1

  # Turnstile Gate QR Pass
  qr_flutter: ^4.1.0

  # Private Certificate Document Picker & Upload
  file_picker: ^8.1.4

  # WhatsApp Reminders & External Links
  url_launcher: ^6.3.1

  # Local Preferences & Language Persistence
  shared_preferences: ^2.3.2

  # ID Generation
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
